<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YouTube 批量字幕下载</title>
  <link rel="stylesheet" href="youtube.css">
</head>
<body>
  <div class="batch-container">
    <header class="batch-header">
      <div class="header-left">
        <a href="batch.html" class="back-link">← 返回</a>
        <h1>YouTube 批量字幕下载</h1>
      </div>
      <button id="closeBtn" type="button" title="关闭">✕</button>
    </header>

    <div class="batch-toolbar">
      <button id="scanBtn" type="button">🔄 扫描标签页</button>
      <button id="autoSelectBtn" type="button">自动选择最佳字幕</button>
      <button id="startBtn" type="button" class="primary">▶ 开始下载</button>
    </div>

    <div class="batch-settings-row">
      <label>
        首选语言：
        <select id="langSelect">
          <option value="">自动（原语言优先）</option>
          <option value="zh">中文</option>
          <option value="zh-Hans">简体中文</option>
          <option value="en">英文</option>
          <option value="ja">日语</option>
          <option value="ko">韩语</option>
          <option value="es">西班牙语</option>
          <option value="fr">法语</option>
          <option value="de">德语</option>
        </select>
      </label>
      <label>
        输出格式：
        <select id="formatSelect">
          <option value="md">Markdown</option>
          <option value="srt">SRT</option>
          <option value="txt">TXT</option>
        </select>
      </label>
      <label>
        <input type="checkbox" id="preferManual" checked />
        优先手动字幕（非自动生成）
      </label>
    </div>

    <div id="status" class="batch-status">请点击"扫描标签页"获取当前打开的 YouTube 视频。</div>
    <div id="progress" class="batch-progress" style="display:none;">
      <div class="progress-bar"><div id="progressFill" class="progress-fill"></div></div>
      <span id="progressText">0 / 0</span>
    </div>

    <div id="videoList" class="video-list">
      <!-- 动态生成 -->
    </div>

    <div id="resultSummary" class="result-summary" style="display:none;"></div>
  </div>

  <script src="youtube.js"></script>
</body>
</html>
